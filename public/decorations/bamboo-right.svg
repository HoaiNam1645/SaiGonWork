<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" fill="none">
  <defs>
    <radialGradient id="leafR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D1F0A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3D1F0A" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Main drooping branch from top-right corner (mirrored) -->
  <path d="M 320 0 Q 280 60 240 130 Q 210 200 190 290 Q 175 380 170 480"
    stroke="#3D1F0A" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Secondary thinner branch -->
  <path d="M 260 100 Q 230 160 220 240"
    stroke="#3D1F0A" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Tertiary branch -->
  <path d="M 220 200 Q 180 260 155 340"
    stroke="#3D1F0A" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Cluster 1: top -->
  <g fill="url(#leafR)" transform="translate(280 70)">
    <ellipse cx="0" cy="35" rx="4" ry="35" transform="rotate(25)"/>
    <ellipse cx="0" cy="38" rx="4" ry="38" transform="rotate(10)"/>
    <ellipse cx="0" cy="40" rx="4" ry="40" transform="rotate(-8)"/>
    <ellipse cx="0" cy="36" rx="4" ry="36" transform="rotate(-22)"/>
    <ellipse cx="0" cy="30" rx="3" ry="30" transform="rotate(-36)"/>
  </g>

  <!-- Cluster 2 -->
  <g fill="url(#leafR)" transform="translate(235 155)">
    <ellipse cx="0" cy="40" rx="4.5" ry="40" transform="rotate(30)"/>
    <ellipse cx="0" cy="44" rx="4.5" ry="44" transform="rotate(12)"/>
    <ellipse cx="0" cy="46" rx="4.5" ry="46" transform="rotate(-6)"/>
    <ellipse cx="0" cy="42" rx="4.5" ry="42" transform="rotate(-24)"/>
    <ellipse cx="0" cy="36" rx="4" ry="36" transform="rotate(-40)"/>
  </g>

  <!-- Cluster 3 -->
  <g fill="url(#leafR)" transform="translate(205 250)">
    <ellipse cx="0" cy="42" rx="4.5" ry="42" transform="rotate(28)"/>
    <ellipse cx="0" cy="46" rx="4.5" ry="46" transform="rotate(8)"/>
    <ellipse cx="0" cy="48" rx="5" ry="48" transform="rotate(-12)"/>
    <ellipse cx="0" cy="44" rx="4.5" ry="44" transform="rotate(-30)"/>
    <ellipse cx="0" cy="36" rx="4" ry="36" transform="rotate(-46)"/>
  </g>

  <!-- Cluster 4 -->
  <g fill="url(#leafR)" opacity="0.85" transform="translate(150 320)">
    <ellipse cx="0" cy="32" rx="4" ry="32" transform="rotate(18)"/>
    <ellipse cx="0" cy="36" rx="4" ry="36" transform="rotate(-2)"/>
    <ellipse cx="0" cy="34" rx="4" ry="34" transform="rotate(-22)"/>
    <ellipse cx="0" cy="28" rx="3.5" ry="28" transform="rotate(-40)"/>
  </g>

  <!-- Cluster 5 -->
  <g fill="url(#leafR)" transform="translate(180 410)">
    <ellipse cx="0" cy="38" rx="4.5" ry="38" transform="rotate(25)"/>
    <ellipse cx="0" cy="42" rx="4.5" ry="42" transform="rotate(5)"/>
    <ellipse cx="0" cy="44" rx="4.5" ry="44" transform="rotate(-15)"/>
    <ellipse cx="0" cy="40" rx="4" ry="40" transform="rotate(-35)"/>
  </g>

  <!-- Cluster 6 -->
  <g fill="url(#leafR)" opacity="0.8" transform="translate(165 510)">
    <ellipse cx="0" cy="30" rx="3.5" ry="30" transform="rotate(20)"/>
    <ellipse cx="0" cy="34" rx="4" ry="34" transform="rotate(0)"/>
    <ellipse cx="0" cy="32" rx="3.5" ry="32" transform="rotate(-20)"/>
  </g>
</svg>
