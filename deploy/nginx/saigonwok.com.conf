# =============================================================================
# Sai Gon Wok — nginx reverse proxy cho domain chính saigonwok.com
# FE: Next.js  → 127.0.0.1:5175   |   BE: Express → 127.0.0.1:4000 (REST + socket.io)
#
# Base config (HTTP). Chạy `certbot --nginx -d saigonwok.com` để cấp SSL — certbot
# sẽ tự thêm block 443 + redirect 80→443.
#
# Lưu ý: frontend build với NEXT_PUBLIC_API_URL=/api (tương đối) nên block này
# dùng chung cho mọi domain trỏ về server — không hardcode host trong app.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name saigonwok.com;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Next.js
    location / {
        proxy_pass         http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
