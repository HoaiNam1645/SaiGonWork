# =============================================================================
# Sai Gon Wok — nginx reverse proxy
# Domain:   sai-gon-work.lemiex.us
# FE:       Next.js  → 127.0.0.1:5175
# BE:       Express  → 127.0.0.1:4000  (REST + socket.io)
# =============================================================================

# HTTP → HTTPS redirect (certbot sẽ tự thêm sau khi xin cert)
server {
    listen 80;
    listen [::]:80;
    server_name sai-gon-work.lemiex.us;

    # Cho certbot challenge đi qua trước khi redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sai-gon-work.lemiex.us;

    # SSL — sẽ được certbot quản (placeholder, certbot sẽ tự sửa)
    ssl_certificate     /etc/letsencrypt/live/sai-gon-work.lemiex.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sai-gon-work.lemiex.us/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/sai-gon-work.access.log;
    error_log  /var/log/nginx/sai-gon-work.error.log warn;

    # Upload size — đủ cho ảnh QR/menu upload nếu có
    client_max_body_size 10m;

    # Gzip — Next.js đã có Brotli nhưng vẫn enable cho JSON/text
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # Backend API  →  /api/* + socket.io
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Forward client info để BE rate-limit per-IP đúng (trust proxy=1 ở Express)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cookie cho subdomain (mặc định đã đúng vì cùng host)
        proxy_pass_request_headers on;

        # Timeouts — đủ cho OSRM routing + sendMail
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Socket.io (long-poll + websocket upgrade)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket idle timeout dài (default nginx 60s sẽ disconnect)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Frontend Next.js  →  mọi route còn lại
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:5175;
        proxy_http_version 1.1;

        # Cần Upgrade cho Next.js HMR (dev) + RSC streaming (prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
